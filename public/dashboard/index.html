<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nina Career Dashboard</title>
<style>
:root{--ink:#563f5f;--muted:#8b748f;--line:#f2d7e6;--pink:#ff77ad;--rose:#ff8e9f;--orange:#ffad72;--yellow:#ffd45f;--mint:#81dfbf;--sky:#83cfff;--lav:#aa96ff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 0,#ffe3f0 0,transparent 25%),radial-gradient(circle at 92% 0,#fff0bd 0,transparent 22%),linear-gradient(135deg,#fff8fb,#fffdf5)}body{padding:9px}.shell{max-width:1440px;height:calc(100vh - 18px);margin:auto;display:grid;grid-template-rows:auto 1fr;gap:8px}.head{min-height:76px;display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:center;padding:12px 18px;color:#fff;border-radius:20px;background:linear-gradient(120deg,#ff7eb6,#ff9e97 46%,#ffd66f);box-shadow:0 10px 28px rgba(226,108,157,.16)}h1{margin:0;font-size:clamp(21px,2.2vw,30px);line-height:1.05}.head p{margin:5px 0 0;font-size:clamp(11px,1vw,13px);font-weight:650}.count{min-width:200px;padding:8px 13px;text-align:center;border:1px solid rgba(255,255,255,.32);border-radius:15px;background:rgba(255,255,255,.22)}.count strong{display:block;font-size:32px;line-height:1}.count span{display:block;margin-top:3px;font-size:10px}.headline{grid-column:1/-1;padding-top:6px;border-top:1px solid rgba(255,255,255,.22);font-size:11px;font-weight:750}.layout{min-height:0;display:grid;grid-template-columns:minmax(0,1.43fr) minmax(330px,.57fr);gap:8px}.card{min-height:0;background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.82);border-radius:18px;box-shadow:0 10px 28px rgba(226,108,157,.12)}.progress{padding:9px;display:grid;grid-template-rows:auto auto auto;gap:7px}.group{padding:6px 9px;border:1px solid var(--line);border-radius:14px;background:#fff}.ghead,.ctitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}.ghead h2,.ctitle h2{margin:0;font-size:14px}.ghead span,.ctitle span{color:var(--muted);font-size:9px}.rows{display:grid;gap:4px}.prow{min-height:23px;display:grid;grid-template-columns:minmax(150px,1.25fr) minmax(100px,1fr) 40px;gap:7px;align-items:center}.pname{overflow:hidden;font-size:11px;font-weight:720;text-overflow:ellipsis;white-space:nowrap}.track{height:9px;overflow:hidden;border-radius:999px;background:#fff0f6}.fill{height:100%;border-radius:999px}.value{color:#b55882;font-size:10px;font-weight:800;text-align:right}.pink{background:linear-gradient(90deg,var(--pink),#ff9cc7)}.rose{background:linear-gradient(90deg,var(--rose),#ffb1b7)}.orange{background:linear-gradient(90deg,var(--orange),#ffd0a1)}.yellow{background:linear-gradient(90deg,var(--yellow),#ffea9c)}.mint{background:linear-gradient(90deg,var(--mint),#b9f1dc)}.sky{background:linear-gradient(90deg,var(--sky),#b7e6ff)}.lavender{background:linear-gradient(90deg,var(--lav),#cec2ff)}.daily{min-height:0;display:grid;grid-template-rows:.9fr 1.1fr auto;gap:7px}.dcard{min-height:0;padding:9px;overflow:hidden}.ctitle h2{color:#bd5e86}.tasks{max-height:calc(100% - 30px);display:grid;gap:5px;overflow:auto;padding-right:2px}.task{display:grid;grid-template-columns:16px 1fr auto;gap:7px;align-items:start;padding:7px;border:1px solid #f7dce8;border-radius:11px;background:#fffafd}.task input{width:15px;height:15px;margin:1px 0 0;accent-color:var(--pink)}.task b{display:block;font-size:11px;line-height:1.35}.task small{display:block;margin-top:2px;color:var(--muted);font-size:9.5px;line-height:1.35}.task button{border:0;background:transparent;color:#c58aa4;cursor:pointer;font-size:14px}.add{display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:6px}.add input{width:100%;padding:7px 8px;border:1px solid #efcddd;border-radius:9px;outline:0;background:#fffafd;color:var(--ink);font-size:10px}.add button{padding:6px 10px;border:0;border-radius:9px;cursor:pointer;color:#fff;font-size:10px;font-weight:800;background:linear-gradient(90deg,#ff7eb6,#ffad82)}.note{display:flex;justify-content:space-between;gap:8px;padding:6px 9px;color:#7e667f;border:1px solid #f3dce7;border-radius:12px;background:linear-gradient(90deg,#fff0f7,#fff7e7);font-size:9px}@media(max-width:900px){.shell{height:auto;min-height:100vh}.layout{grid-template-columns:1fr}.daily{grid-template-rows:auto}.tasks{max-height:none}}@media(max-width:560px){body{padding:5px}.head{grid-template-columns:1fr auto;padding:10px 12px;border-radius:14px}.count{min-width:120px}.count strong{font-size:26px}.prow{grid-template-columns:minmax(112px,1.2fr) 1fr 36px;gap:5px}.pname{font-size:10px}.note{flex-direction:column;gap:2px}}
</style>
</head>
<body>
<div class="shell">
<header class="head"><div><h1>Nina Career Dashboard</h1><p>一年后完成职业跃迁：从航空算法负责人走向 Decision Intelligence 与高价值智能决策岗位。</p></div><div class="count"><strong id="days">365</strong><span>距离目标跳槽时间</span></div><div class="headline" id="headline">正在读取最新工作台…</div></header>
<div class="layout"><section class="card progress" id="progress"></section><aside class="daily"><section class="card dcard"><div class="ctitle"><h2>昨天完成</h2><span id="ydate"></span></div><div class="tasks" id="yesterday"></div></section><section class="card dcard"><div class="ctitle"><h2>今天要完成</h2><span id="tdate"></span></div><div class="tasks" id="today"></div><div class="add"><input id="newTask" placeholder="临时增加一项任务"><button id="addBtn">添加</button></div></section><div class="note"><span id="updated">等待首次同步</span><span>本机新增任务只保存在当前浏览器</span></div></aside></div>
</div>
<script>
const KEY='nina-career-dashboard-local-v1';let remote={today:[],yesterday:[],progress:[],targetDate:'2027-08-01',todayDate:'',yesterdayDate:'',headline:'',updatedAt:''};let local=load();function load(){try{return JSON.parse(localStorage.getItem(KEY))||{date:'',checked:{},extras:[]}}catch{return{date:'',checked:{},extras:[]}}}function save(){localStorage.setItem(KEY,JSON.stringify(local))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function setDays(){const n=Math.max(0,Math.ceil((new Date(remote.targetDate+'T00:00:00')-new Date())/86400000));document.getElementById('days').textContent=n}function taskHtml(t,done,localTask){return `<label class="task"><input type="checkbox" data-id="${esc(t.id)}" ${done?'checked':''} ${done&&!localTask?'disabled':''}><div><b>${esc(t.text)}</b>${t.detail?`<small>${esc(t.detail)}</small>`:''}</div>${localTask?`<button data-remove="${esc(t.id)}">×</button>`:''}</label>`}function render(){setDays();document.getElementById('headline').textContent=remote.headline;document.getElementById('ydate').textContent=remote.yesterdayDate;document.getElementById('tdate').textContent=remote.todayDate;document.getElementById('updated').textContent='最后更新：'+remote.updatedAt;const names=['TravelSky','智能决策','第二曲线'];document.getElementById('progress').innerHTML=names.map(name=>`<div class="group"><div class="ghead"><h2>${name}</h2><span>${name==='TravelSky'?'核心项目资产':name==='智能决策'?'跨行业迁移能力':'长期选择权'}</span></div><div class="rows">${remote.progress.filter(x=>x.group===name).map(x=>`<div class="prow"><div class="pname" title="${esc(x.name)}">${esc(x.name)}</div><div class="track"><div class="fill ${esc(x.color)}" style="width:${Number(x.value)||0}%"></div></div><div class="value">${Number(x.value)||0}%</div></div>`).join('')}</div></div>`).join('');document.getElementById('yesterday').innerHTML=remote.yesterday.map(t=>taskHtml(t,true,false)).join('');const all=[...remote.today,...local.extras];document.getElementById('today').innerHTML=all.map(t=>taskHtml(t,!!local.checked[t.id],t.id.startsWith('local-'))).join('');document.querySelectorAll('#today input').forEach(el=>el.onchange=e=>{local.checked[e.target.dataset.id]=e.target.checked;save()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=e=>{e.preventDefault();local.extras=local.extras.filter(x=>x.id!==b.dataset.remove);delete local.checked[b.dataset.remove];save();render()})}function add(){const el=document.getElementById('newTask'),text=el.value.trim();if(!text)return;local.extras.push({id:'local-'+Date.now(),text});el.value='';save();render()}document.getElementById('addBtn').onclick=add;document.getElementById('newTask').onkeydown=e=>{if(e.key==='Enter')add()};fetch('./data.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{remote=d;if(local.date!==d.todayDate){local={date:d.todayDate,checked:{},extras:local.extras.filter(t=>!local.checked[t.id])};save()}render()}).catch(()=>{document.getElementById('headline').textContent='工作台数据暂时加载失败，请刷新页面。'});
</script>
</body>
</html>
