name: Dashboard Consistency Check

on:
  schedule:
    - cron: '30 15 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run dashboard consistency check
        run: python automation/dashboard_sync_check.py
